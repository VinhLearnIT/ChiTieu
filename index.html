<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ chi tiêu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--sf:#fff;--ink:#1d2a25;--mut:#6b7872;--line:#dde3dd;--acc:#1f6f5b;--onacc:#fff;--exp:#c2512f;--inc:#1f6f5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--sf:#1b2622;--ink:#e6eee9;--mut:#93a39b;--line:#2c3a34;--acc:#4cc2a1;--onacc:#0d1d18;--exp:#f0805c;--inc:#4cc2a1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a17;--sf:#1b2622;--ink:#e6eee9;--mut:#93a39b;--line:#2c3a34;--acc:#4cc2a1;--onacc:#0d1d18;--exp:#f0805c;--inc:#4cc2a1;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:130px}
#app{max-width:560px;margin:0 auto;padding:14px 14px 0}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mn b{font-size:17px}
button{font:inherit;color:inherit;cursor:pointer}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--sf)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.hero{background:var(--acc);color:var(--onacc);border:0}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.hero .row{display:flex;gap:24px;margin-top:10px}
.hero small{display:block;opacity:.8}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--exp)}
.mut{color:var(--mut);font-size:13px}
.flex{display:flex;align-items:center;gap:14px}
.donut{width:130px;flex:none}.dt{font-size:7px;fill:var(--mut);text-anchor:middle}.dv{font-size:11px;font-weight:700;fill:var(--ink)}
.lg{flex:1;min-width:0}.lg div{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}
.lg span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ax{font-size:8px;fill:var(--mut)}
.empty{color:var(--mut);padding:8px 0;font-size:14px}
.day{font-size:13px;color:var(--mut);margin:14px 4px 6px;font-weight:500}
.tx{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.tx .m{flex:1;min-width:0}.tx .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:500;white-space:nowrap}
.e{color:var(--exp)}.i{color:var(--inc)}
.del{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles div{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px}
.tiles b{display:block;font-size:14px;margin-top:2px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 4px;font-size:12.5px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.fab{position:fixed;right:18px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
#sheet.show{display:flex}
.sh{background:var(--sf);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px}
.seg button.on{background:var(--sf);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#amt{font-size:22px;font-weight:700}
.pri{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font-weight:700}
.sec{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--sf)}
.cx{border:0;background:none;color:var(--mut);float:right;font-size:22px}
textarea{width:100%;height:90px;font:12px monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:none;z-index:30;gap:12px;align-items:center}
#toast.show{display:flex}#toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}
.card{box-shadow:0 3px 10px rgba(0,0,0,.10);border-radius:18px;margin-bottom:18px}
.card h3{border-left:5px solid var(--acc);padding-left:10px;font-size:16px;margin:0 0 14px}
.ci{border-top:5px solid var(--inc)}.ce{border-top:5px solid var(--exp)}
.ce h3{border-left-color:var(--exp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.two .card{margin:0;padding:14px}
.two b{display:block;font-size:19px;margin-top:2px}
.ci{background:color-mix(in srgb,var(--inc) 9%,var(--sf))}.ce{background:color-mix(in srgb,var(--exp) 7%,var(--sf))}
.tx.te{border-left:5px solid var(--exp);background:color-mix(in srgb,var(--exp) 8%,var(--sf))}
.tx.ti{border-left:5px solid var(--inc);background:color-mix(in srgb,var(--inc) 10%,var(--sf))}
.bd{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-style:normal;flex:none}
.bd.e{background:var(--exp);color:#fff}.bd.i{background:var(--inc);color:var(--onacc)}
.day{display:flex;justify-content:space-between;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink);margin:18px 0 8px}
#bt-e.on{background:var(--exp);color:#fff}#bt-i.on{background:var(--inc);color:var(--onacc)}
.ce.w{background:var(--sf)}
.sw{border-top:5px solid var(--acc)}
.tiles{gap:12px;margin-bottom:18px}
.tiles div{border-radius:16px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,.10);border-top:5px solid var(--acc);font-size:12px}
.tiles div.te2{border-top-color:var(--exp)}
.tiles b{font-size:16px;color:var(--ink);margin-top:4px}
.st th{background:color-mix(in srgb,var(--acc) 14%,var(--sf));color:var(--ink);font-weight:700}
.st th:first-child{border-radius:8px 0 0 8px}.st th:last-child{border-radius:0 8px 8px 0}
.st td{padding:10px 6px}
.st tr.cur td{background:color-mix(in srgb,var(--acc) 10%,var(--sf));font-weight:700}
.pb{display:block;height:6px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden;min-width:50px}.pb i{display:block;height:100%}
</style></head>
<body>
<div id="app"></div>
<button class="fab" onclick="openSheet()" aria-label="Thêm giao dịch">+</button>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sh" id="shb"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n))+' ₫';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'tr':n>=1e3?Math.round(n/1e3)+'k':''+Math.round(n);
const EC={'Ăn uống':'#c2512f','Di chuyển':'#d99a2b','Nhà ở':'#5b7fa6','Mua sắm':'#9a5fa0','Giải trí':'#d4678b','Sức khỏe':'#3f9c8a','Học tập':'#7a8f3a','Khác':'#8a948f'};
const IC={'Lương':'#1f6f5b','Thưởng':'#3f9c8a','Thu khác':'#7a8f3a'};
const col=c=>EC[c]||IC[c]||'#8a948f';
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>ym(new Date())+'-'+String(new Date().getDate()).padStart(2,'0');
const shift=(m,k)=>{const[y,o]=m.split('-').map(Number);return ym(new Date(y,o-1+k,1))};
const mlabel=m=>{const[y,o]=m.split('-');return 'Tháng '+Number(o)+'/'+y};
let S={tx:[],budget:0,m:ym(new Date()),tab:'home',type:'e'},last=null,tt,wipe=false;
const idb=new Promise(res=>{try{const r=indexedDB.open('sochitieu',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const kvGet=async k=>{const d=await idb;if(!d)return null;return new Promise(ok=>{try{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)}catch(e){ok(null)}})};
const kvSet=(k,v)=>idb.then(d=>{if(d)try{d.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}});
const save=()=>kvSet('data',{tx:S.tx,budget:S.budget});
const mtx=m=>S.tx.filter(x=>x.d.startsWith(m));
const sum=(l,t)=>l.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const cats=l=>{const o={};l.filter(x=>x.t==='e').forEach(x=>o[x.c]=(o[x.c]||0)+x.a);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const daysIn=m=>{const[y,o]=m.split('-').map(Number);return new Date(y,o,0).getDate()};

function donut(cs,total){
  if(!total)return'<div class="empty">Chưa có khoản chi nào trong tháng này.</div>';
  const C=2*Math.PI*40;let off=0;
  const seg=cs.map(([c,v])=>{const l=v/total*C;const s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${col(c)}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return s}).join('');
  const lg=cs.slice(0,6).map(([c,v])=>`<div><i class="dot" style="background:${col(c)}"></i><span class="n">${c}</span><span>${Math.round(v/total*100)}%</span></div>`).join('');
  return `<div class="flex"><svg viewBox="0 0 100 100" class="donut" role="img" aria-label="Biểu đồ tròn chi theo danh mục">${seg}<text x="50" y="48" class="dt">Tổng chi</text><text x="50" y="60" class="dv" text-anchor="middle">${short(total)}</text></svg><div class="lg">${lg}</div></div>`;
}
function bars(d,two){
  const W=320,H=130,pb=16,max=Math.max(1,...d.map(x=>Math.max(x.a,x.b||0))),n=d.length,gw=W/n,bw=two?gw*.3:gw*.62,h=v=>v/max*(H-pb-10);
  let s=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  d.forEach((x,i)=>{const cx=i*gw+gw/2;
    if(two)s+=`<rect x="${cx-bw-1}" y="${H-pb-h(x.b)}" width="${bw}" height="${h(x.b)}" rx="2" fill="var(--inc)"/><rect x="${cx+1}" y="${H-pb-h(x.a)}" width="${bw}" height="${h(x.a)}" rx="2" fill="var(--exp)"/>`;
    else if(x.a)s+=`<rect x="${cx-bw/2}" y="${H-pb-h(x.a)}" width="${bw}" height="${h(x.a)}" rx="1.5" fill="var(--exp)"/>`;
    if(n<=12||(i+1)%5===0||i===0)s+=`<text x="${cx}" y="${H-3}" class="ax" text-anchor="middle">${x.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ cột">${s}</svg>`;
}

function home(){
  const l=mtx(S.m),inc=sum(l,'i'),exp=sum(l,'e'),cs=cats(l);
  let bud='';
  if(S.budget>0){const p=exp/S.budget*100,left=S.budget-exp;
    bud=`<div class="card"><h3>Ngân sách tháng</h3><div class="bar"><i class="${p>100?'over':''}" style="width:${Math.min(100,p)}%"></i></div><div class="mut">Đã chi ${Math.round(p)}% · ${left>=0?'còn '+fmt(left):'vượt '+fmt(-left)}</div></div>`}
  else bud=`<div class="card mut">Chưa đặt ngân sách tháng. Vào Cài đặt để đặt hạn mức chi.</div>`;
  const dd=[];for(let i=1;i<=daysIn(S.m);i++){const k=S.m+'-'+String(i).padStart(2,'0');dd.push({l:i,a:sum(l.filter(x=>x.d===k),'e')})}
  return `<div class="card hero"><small>Số dư trong tháng</small><div class="big">${fmt(inc-exp)}</div></div><div class="two"><div class="card ci"><span class="mut">▲ Thu nhập</span><b class="i">${fmt(inc)}</b></div><div class="card ce"><span class="mut">▼ Chi tiêu</span><b class="e">${fmt(exp)}</b></div></div>${bud}
  <div class="card ce w"><h3>Chi theo danh mục</h3>${donut(cs,exp)}</div>
  <div class="card ce w"><h3>Chi theo ngày</h3>${exp?bars(dd):'<div class="empty">Thêm khoản chi đầu tiên bằng nút +.</div>'}</div>`;
}
function list(){
  const l=mtx(S.m).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  if(!l.length)return'<div class="card empty">Chưa có giao dịch trong tháng này. Nhấn + để thêm.</div>';
  const W=['CN','T2','T3','T4','T5','T6','T7'];let out='',cur='';
  l.forEach(x=>{if(x.d!==cur){cur=x.d;const dt=new Date(x.d+'T00:00:00');const dl=l.filter(y=>y.d===x.d),di=sum(dl,'i'),de=sum(dl,'e');out+=`<div class="day"><span>${W[dt.getDay()]}, ${x.d.slice(8)}/${x.d.slice(5,7)}</span><span>${di?`<span class="i">+${short(di)}</span> `:''}${de?`<span class="e">−${short(de)}</span>`:''}</span></div>`}
    out+=`<div class="tx t${x.t}"><i class="bd ${x.t}">${x.t==='e'?'▼':'▲'}</i><div class="m"><div>${x.c}</div>${x.n?`<div class="mut">${esc(x.n)}</div>`:''}</div><div class="a ${x.t}">${x.t==='e'?'−':'+'}${fmt(x.a)}</div><button class="del" onclick="del(${x.id})" aria-label="Xóa">×</button></div>`});
  return out;
}
function stats(){
  const l=mtx(S.m),inc=sum(l,'i'),exp=sum(l,'e'),cs=cats(l),ex=l.filter(x=>x.t==='e');
  const big=ex.length?Math.max(...ex.map(x=>x.a)):0;
  const now=ym(new Date()),dn=S.m===now?new Date().getDate():daysIn(S.m);
  const six=[];for(let k=-5;k<=0;k++){const m=shift(S.m,k),t=mtx(m);six.push({m,l:'T'+Number(m.slice(5)),a:sum(t,'e'),b:sum(t,'i')})}
  const catRows=cs.length?cs.map(([c,v])=>`<tr><td><i class="dot" style="background:${col(c)};display:inline-block"></i> ${c}</td><td>${ex.filter(x=>x.c===c).length}</td><td>${fmt(v)}</td><td>${Math.round(v/exp*100)}%<span class="pb"><i style="width:${v/exp*100}%;background:${col(c)}"></i></span></td></tr>`).join(''):'<tr><td colspan="4" class="mut">Chưa có dữ liệu</td></tr>';
  const monRows=six.slice().reverse().map(x=>`<tr class="${x.m===S.m?'cur':''}"><td>${mlabel(x.m).replace('Tháng ','T')}</td><td class="i">${fmt(x.b)}</td><td class="e">${fmt(x.a)}</td><td class="${x.b>=x.a?'i':'e'}">${x.b>=x.a?'+':'−'}${fmt(Math.abs(x.b-x.a))}</td></tr>`).join('');
  return `<div class="two"><div class="card ci"><span class="mut">▲ Tổng thu</span><b class="i">${fmt(inc)}</b></div><div class="card ce"><span class="mut">▼ Tổng chi</span><b class="e">${fmt(exp)}</b></div></div><div class="tiles"><div class="te2 mut">Chi TB/ngày<b>${fmt(exp/dn)}</b></div><div class="te2 mut">Chi lớn nhất<b>${fmt(big)}</b></div><div class="mut">Giao dịch<b>${l.length}</b></div></div>
  <div class="card sw"><h3>Thu và chi 6 tháng</h3>${bars(six,true)}<div class="leg"><span><i class="dot" style="background:var(--inc);display:inline-block"></i> Thu</span><span><i class="dot" style="background:var(--exp);display:inline-block"></i> Chi</span></div></div>
  <div class="card sw"><h3>Bảng theo tháng</h3><div class="wrap"><table class="st"><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Chênh lệch</th></tr>${monRows}</table></div></div>
  <div class="card ce"><h3>Bảng theo danh mục · ${mlabel(S.m)}</h3><div class="wrap"><table class="st"><tr><th>Danh mục</th><th>Số GD</th><th>Số tiền</th><th>Tỉ lệ</th></tr>${catRows}</table></div></div>`;
}
function settings(){
  return `<div class="card"><h3>Ngân sách chi mỗi tháng</h3><input id="bud" inputmode="numeric" placeholder="Ví dụ: 10.000.000" value="${S.budget?S.budget.toLocaleString('vi-VN'):''}" oninput="fmtIn(this)"><button class="pri" onclick="setBud()">Lưu ngân sách</button></div>
  <div class="card"><h3>Sao lưu dữ liệu</h3><p class="mut" style="margin-top:0">Dữ liệu chỉ lưu trên trình duyệt của máy này. Sao chép đoạn mã bên dưới để lưu dự phòng hoặc chuyển sang máy khác.</p><textarea id="bk" placeholder="Dán mã sao lưu vào đây để khôi phục"></textarea><button class="sec" onclick="exp()">Tạo và sao chép mã sao lưu</button><button class="sec" onclick="imp()">Khôi phục từ mã đã dán</button><button class="sec e" onclick="clr()">${wipe?'Nhấn lần nữa để xóa tất cả':'Xóa toàn bộ dữ liệu'}</button></div>`;
}
const TABS=[['home','Tổng quan'],['list','Giao dịch'],['stats','Thống kê'],['set','Cài đặt']];
function render(){
  const mn=S.tab==='set'?'':`<div class="mn"><button class="ib" onclick="mv(-1)" aria-label="Tháng trước">‹</button><b>${mlabel(S.m)}</b><button class="ib" onclick="mv(1)" aria-label="Tháng sau">›</button></div>`;
  $('#app').innerHTML=mn+({home,list,stats,set:settings}[S.tab])();
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
}
const go=t=>{S.tab=t;wipe=false;render();scrollTo(0,0)};
const mv=k=>{S.m=shift(S.m,k);render()};
function fmtIn(el){const v=el.value.replace(/\D/g,'');el.value=v?Number(v).toLocaleString('vi-VN'):''}
const num=s=>Number(String(s).replace(/\D/g,''))||0;
function toast(msg,act){const t=$('#toast');t.innerHTML=esc(msg)+(act?`<button onclick="undo()">Hoàn tác</button>`:'');t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),act?5000:2200)}
function openSheet(){
  $('#shb').innerHTML=`<button class="cx" onclick="closeSheet()" aria-label="Đóng">×</button><h3>Thêm giao dịch</h3>
  <div class="seg"><button id="bt-e" onclick="setType('e')">Chi tiêu</button><button id="bt-i" onclick="setType('i')">Thu nhập</button></div>
  <label for="amt">Số tiền (₫)</label><input id="amt" inputmode="numeric" placeholder="0" oninput="fmtIn(this)">
  <label for="cat">Danh mục</label><select id="cat"></select>
  <label for="dt">Ngày</label><input id="dt" type="date" value="${today()}">
  <label for="nt">Ghi chú</label><input id="nt" placeholder="Không bắt buộc" maxlength="80">
  <button class="pri" onclick="add()">Lưu giao dịch</button>`;
  setType('e');$('#sheet').classList.add('show');setTimeout(()=>$('#amt').focus(),50);
}
function setType(t){S.type=t;$('#bt-e').className=t==='e'?'on':'';$('#bt-i').className=t==='i'?'on':'';const p=document.querySelector('#shb .pri');p.style.background=t==='e'?'var(--exp)':'var(--inc)';p.style.color=t==='e'?'#fff':'var(--onacc)';$('#amt').style.color=t==='e'?'var(--exp)':'var(--inc)';
  $('#cat').innerHTML=Object.keys(t==='e'?EC:IC).map(c=>`<option>${c}</option>`).join('')}
const closeSheet=()=>$('#sheet').classList.remove('show');
function add(){
  const a=num($('#amt').value);if(!a){$('#amt').focus();toast('Nhập số tiền lớn hơn 0');return}
  const d=$('#dt').value||today();
  S.tx.push({id:Date.now(),t:S.type,a,c:$('#cat').value,d,n:$('#nt').value.trim()});
  save();S.m=d.slice(0,7);closeSheet();render();toast('Đã lưu giao dịch');
}
function del(id){const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;last=S.tx.splice(i,1)[0];save();render();toast('Đã xóa giao dịch',1)}
function undo(){if(last){S.tx.push(last);last=null;save();render();$('#toast').classList.remove('show')}}
function setBud(){S.budget=num($('#bud').value);save();toast(S.budget?'Đã lưu ngân sách':'Đã tắt ngân sách')}
function exp(){const el=$('#bk');el.value=JSON.stringify({tx:S.tx,budget:S.budget});el.select();
  try{navigator.clipboard.writeText(el.value).then(()=>toast('Đã sao chép mã sao lưu'),()=>toast('Hãy tự sao chép đoạn mã đã chọn'))}catch(e){toast('Hãy tự sao chép đoạn mã đã chọn')}}
function imp(){try{const r=JSON.parse($('#bk').value);if(!Array.isArray(r.tx))throw 0;S.tx=r.tx.filter(x=>x&&x.d&&x.a>0&&(x.t==='e'||x.t==='i'));S.budget=r.budget||0;save();render();toast('Đã khôi phục dữ liệu')}catch(e){toast('Mã sao lưu không hợp lệ')}}
function clr(){if(!wipe){wipe=true;render();return}S.tx=[];S.budget=0;wipe=false;save();render();toast('Đã xóa toàn bộ dữ liệu')}
(async()=>{let r=await kvGet('data');if(!r){try{r=JSON.parse(localStorage.getItem('sochitieu')||'null');if(r)kvSet('data',r)}catch(e){}}
if(r){S.tx=r.tx||[];S.budget=r.budget||0}render()})();
</script>
</body></html>
